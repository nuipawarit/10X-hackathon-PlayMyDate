services:
  # Backend API
  - type: web
    name: playmydate-backend
    runtime: node
    rootDir: src/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: playmydate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: playmydate-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: playmydate-frontend
          type: web
          property: url

  # Frontend
  - type: web
    name: playmydate-frontend
    runtime: static
    rootDir: src/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: playmydate-backend
          type: web
          property: url

databases:
  - name: playmydate-db
    plan: free

redis:
  - name: playmydate-redis
    plan: free
