services:
  # Backend API
  - type: web
    name: playmydate-backend
    runtime: node
    rootDir: src/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: playmydate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: playmydate-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://playmydate-frontend.onrender.com

  # Frontend
  - type: web
    name: playmydate-frontend
    runtime: static
    rootDir: src/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://playmydate-backend.onrender.com

  # Redis
  - type: redis
    name: playmydate-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all (for Render internal services)

databases:
  - name: playmydate-db
    plan: free
