        campaignIds:
          type: array
          items:
            type: string
            format: uuid

    ReportResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            reportType:
              type: string
            status:
              type: string
            data:
              type: object
            generatedAt:
              type: string
              format: date-time

    InvoicesResponse:
      type: object
